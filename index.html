<script>
'use strict';
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const STORAGE_KEY = 'finanzas-inventario:data:v1';
const UI_KEY = 'finanzas-inventario:ui:v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(((+n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const sum = (arr, f) => r2((arr || []).reduce((a, x) => a + (typeof f === 'function' ? (+f(x) || 0) : (+x[f] || 0)), 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = String(s || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmtDate = s => s ? pd(s).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtShort = s => s ? pd(s).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '—';
const fmtInt = n => new Intl.NumberFormat('es-MX').format(n || 0);
const ic = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c}"></i>`;
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0);
const find = (arr, id) => arr.find(x => x.id === id);
const ALL = { start: '0000-01-01', end: '9999-12-31' };
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function money(n) {
  const cur = (S && S.settings && S.settings.currency) || 'MXN';
  try { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: cur, minimumFractionDigits: 2 }).format(n || 0); }
  catch { return '$' + (+n || 0).toFixed(2); }
}
function nextOcc(day, from = today()) {
  if (!day) return null;
  const f = pd(from); let y = f.getFullYear(), m = f.getMonth();
  let d = new Date(y, m, Math.min(day, dim(y, m)));
  if (d < f) { m++; if (m > 11) { m = 0; y++; } d = new Date(y, m, Math.min(day, dim(y, m))); }
  return ds(d);
}
function lastOcc(day, from = today()) {
  if (!day) return null;
  const f = pd(from); let y = f.getFullYear(), m = f.getMonth();
  let d = new Date(y, m, Math.min(day, dim(y, m)));
  if (d > f) { m--; if (m < 0) { m = 11; y--; } d = new Date(y, m, Math.min(day, dim(y, m))); }
  return ds(d);
}

/* Periodos */
function rangeFor(period, anchor, from, to) {
  const d = pd(anchor || today()); const y = d.getFullYear(), m = d.getMonth();
  switch (period) {
    case 'semanal': { const wd = (d.getDay() + 6) % 7; const s = new Date(y, m, d.getDate() - wd); const e = new Date(s); e.setDate(s.getDate() + 6); return { start: ds(s), end: ds(e) }; }
    case 'quincenal': return d.getDate() <= 15 ? { start: ds(new Date(y, m, 1)), end: ds(new Date(y, m, 15)) } : { start: ds(new Date(y, m, 16)), end: ds(new Date(y, m, dim(y, m))) };
    case 'mensual': return { start: ds(new Date(y, m, 1)), end: ds(new Date(y, m, dim(y, m))) };
    case 'anual': return { start: `${y}-01-01`, end: `${y}-12-31` };
    case 'custom': return { start: from || ALL.start, end: to || ALL.end };
    default: return { ...ALL };
  }
}
const inRange = (date, r) => !!date && date >= r.start && date <= r.end;
const shiftAnchor = (period, anchor, dir) => { const r = rangeFor(period, anchor); return dir > 0 ? addDays(r.end, 1) : addDays(r.start, -1); };
function rangeLabel(period, r) {
  if (period === 'total') return 'Histórico total';
  if (period === 'mensual') return cap(pd(r.start).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }));
  if (period === 'anual') return r.start.slice(0, 4);
  if (period === 'custom') {
    if (r.start === ALL.start && r.end === ALL.end) return 'Todo';
    if (r.start === ALL.start) return `Hasta ${fmtDate(r.end)}`;
    if (r.end === ALL.end) return `Desde ${fmtDate(r.start)}`;
  }
  const sameYear = r.start.slice(0, 4) === r.end.slice(0, 4);
  return `${fmtShort(r.start)} – ${fmtShort(r.end)}${sameYear ? ' ' + r.end.slice(0, 4) : ''}`;
}

/* =====================================================================
   ESTADO Y PERSISTENCIA
   ===================================================================== */
const defaultState = () => ({
  version: 1,
  settings: { currency: 'MXN', initialBalance: 0, lowStock: 5, lastBackup: null },
  products: [], sales: [], debts: [], expenses: [], incomes: [], cards: []
});

function normalize(raw) {
  const base = defaultState();
  const src = raw && raw.data && (raw.app || raw.exportedAt) ? raw.data : raw;
  if (!src || typeof src !== 'object' || Array.isArray(src)) throw new Error('Formato de archivo no válido');
  const out = { ...base, ...src, settings: { ...base.settings, ...(src.settings || {}) } };
  ['products', 'sales', 'debts', 'expenses', 'incomes', 'cards'].forEach(k => { out[k] = Array.isArray(src[k]) ? src[k] : []; });
  out.settings.initialBalance = num(out.settings.initialBalance);
  out.settings.lowStock = Math.max(0, Math.floor(num(out.settings.lowStock)));
  out.products.forEach(p => { p.id = p.id || uid(); p.stock = Math.floor(num(p.stock)); p.cost = num(p.cost); p.price = num(p.price); });
  out.sales.forEach(s => { s.id = s.id || uid(); s.qty = Math.floor(num(s.qty)); s.unitPrice = num(s.unitPrice); s.unitCost = num(s.unitCost); s.total = r2(s.qty * s.unitPrice); s.payType = s.payType === 'credito' ? 'credito' : 'contado'; });
  out.debts.forEach(d => {
    d.id = d.id || uid(); d.payments = Array.isArray(d.payments) ? d.payments : []; d.interests = Array.isArray(d.interests) ? d.interests : [];
    d.skipCuts = Array.isArray(d.skipCuts) ? d.skipCuts : []; d.principal = num(d.principal); d.rate = num(d.rate); d.cutDay = Math.floor(num(d.cutDay));
    if (!['prestamo', 'credito_venta', 'deuda'].includes(d.kind)) d.kind = 'prestamo';
    d.payments.forEach(p => { p.id = p.id || uid(); p.amount = num(p.amount); });
    d.interests.forEach(i => { i.id = i.id || uid(); i.amount = num(i.amount); });
  });
  out.expenses.forEach(e => { e.id = e.id || uid(); e.amount = num(e.amount); });
  out.incomes.forEach(e => { e.id = e.id || uid(); e.amount = num(e.amount); });
  out.cards.forEach(c => { c.id = c.id || uid(); c.movements = Array.isArray(c.movements) ? c.movements : []; c.limit = num(c.limit); c.baseUsed = num(c.baseUsed); c.cutBalance = num(c.cutBalance); });
  return out;
}

/* =====================================================================

const isReceivable = d => d.kind !== 'deuda';

function debtCalc(d) {
  const paid = sum(d.payments, 'amount');
  const interest = sum(d.interests, 'amount');
  const insoluto = Math.max(0, r2(d.principal - paid));          // Saldo insoluto = Deuda inicial - Abonos
  const totalDue = r2(d.principal + interest);
  const raw = r2(totalDue - paid);
  const saldo = Math.max(0, raw);
  const status = saldo <= 0.009 ? 'Pagado' : (paid > 0 ? 'Abonado' : 'Pendiente');
  return { paid, interest, insoluto, saldo, totalDue, status, overpaid: raw < 0 ? -raw : 0, progress: totalDue > 0 ? Math.min(1, paid / totalDue) : 1 };
}

function cutDatesFor(d, until) {
  if (!d.autoInterest || !(d.rate > 0) || !d.cutDay || !d.startDate) return [];
  const out = []; const start = pd(d.startDate); const end = pd(until);
  let y = start.getFullYear(), m = start.getMonth();
  for (let i = 0; i < 1200; i++) {
    const c = new Date(y, m, Math.min(d.cutDay, dim(y, m)));
    if (c > end) break;
    if (c > start) out.push(ds(c));
    m++; if (m > 11) { m = 0; y++; }
  }
  const skip = new Set(d.skipCuts || []);
  return out.filter(c => !skip.has(c));
}

/* Interés automático: en cada fecha de corte se aplica la tasa SOLO sobre el saldo insoluto
   (monto inicial - abonos realizados hasta esa fecha). Las entradas editadas manualmente se respetan. */
function syncInterests() {
  const t = today();
  S.debts.forEach(d => {
    d.interests = d.interests || []; d.payments = d.payments || [];
    const cuts = cutDatesFor(d, t); const cutSet = new Set(cuts);
    d.interests = d.interests.filter(i => !i.auto || i.manual || cutSet.has(i.date));
    cuts.forEach(c => {
      const paidBy = sum(d.payments.filter(p => p.date <= c), 'amount');
      const base = Math.max(0, r2(d.principal - paidBy));
      const amount = r2(base * d.rate / 100);
      const e = d.interests.find(i => i.auto && i.date === c);
      if (e) { if (!e.manual) { e.amount = amount; e.base = base; e.rate = d.rate; } }
      else if (amount > 0) d.interests.push({ id: uid(), date: c, amount, base, rate: d.rate, auto: true, manual: false, note: 'Corte automático', createdAt: Date.now() });
    });
    d.interests = d.interests.filter(i => !(i.auto && !i.manual && i.amount <= 0));
    d.interests.sort((a, b) => a.date.localeCompare(b.date));
    d.payments.sort((a, b) => a.date.localeCompare(b.date));
  });
}

function debtTotals() {
  const t = { prestamo: 0, credito_venta: 0, deuda: 0, interes: 0, deudaCount: 0, cobrarCount: 0 };
  S.debts.forEach(d => { const c = debtCalc(d); t[d.kind] += c.saldo; t.interes += c.interest; if (c.saldo > 0) d.kind === 'deuda' ? t.deudaCount++ : t.cobrarCount++; });
  Object.keys(t).forEach(k => t[k] = r2(t[k]));
  t.cobrar = r2(t.prestamo + t.credito_venta);
  return t;
}

function cardCalc(c) {
  const mv = c.movements || [];
  const cargos = sum(mv.filter(m => m.type === 'cargo'), 'amount');
  const pagos = sum(mv.filter(m => m.type === 'pago'), 'amount');
  const used = r2((+c.baseUsed || 0) + cargos - pagos);
  const lastCut = c.cutDay ? lastOcc(c.cutDay) : null;
  const pagosCorte = lastCut ? sum(mv.filter(m => m.type === 'pago' && m.date > lastCut), 'amount') : 0;
  return {
    used, available: r2((+c.limit || 0) - used),
    nextCut: c.cutDay ? nextOcc(c.cutDay) : null, nextPay: c.payDay ? nextOcc(c.payDay) : null,
    pendingCut: Math.max(0, r2((+c.cutBalance || 0) - pagosCorte)), lastCut
  };
}

/* Libro mayor unificado (fuente de verdad del balance y del reporte histórico) */
function ledger() {
  const L = [];
  S.incomes.forEach(i => L.push({ key: 'inc:' + i.id, date: i.date, type: 'ingreso', concept: i.concept, category: i.category || 'General', amount: i.amount, sign: 1, note: i.note, createdAt: i.createdAt, ref: { c: 'incomes', id: i.id } }));
  S.expenses.forEach(e => L.push({ key: 'exp:' + e.id, date: e.date, type: 'gasto', concept: e.concept, category: e.category || 'General', amount: e.amount, sign: -1, note: e.note, createdAt: e.createdAt, ref: { c: 'expenses', id: e.id } }));
  S.sales.forEach(s => L.push({ key: 'sale:' + s.id, date: s.date, type: s.payType === 'credito' ? 'venta_credito' : 'venta', concept: `${s.productName} × ${s.qty}`, person: s.payType === 'credito' ? s.client : '', category: 'Ventas', amount: s.total, sign: s.payType === 'credito' ? 0 : 1, note: s.note, createdAt: s.createdAt, ref: { c: 'sales', id: s.id } }));
  S.debts.forEach(d => {
    const who = d.person + (d.concept ? ' · ' + d.concept : '');
    if (d.kind !== 'credito_venta' && d.affectsBalance) L.push({ key: 'debt:' + d.id, date: d.startDate, type: d.kind === 'prestamo' ? 'prestamo_otorgado' : 'prestamo_recibido', concept: d.concept || (d.kind === 'prestamo' ? 'Préstamo' : 'Deuda'), person: d.person, category: 'Préstamos', amount: d.principal, sign: d.kind === 'prestamo' ? -1 : 1, note: d.note, createdAt: d.createdAt, ref: { c: 'debts', id: d.id } });
    d.payments.forEach(p => L.push({ key: 'pay:' + p.id, date: p.date, type: isReceivable(d) ? 'abono_recibido' : 'abono_pagado', concept: who, category: 'Abonos', amount: p.amount, sign: isReceivable(d) ? 1 : -1, note: p.note, createdAt: p.createdAt, ref: { c: 'payments', id: p.id, parent: d.id } }));
    d.interests.forEach(i => L.push({ key: 'int:' + i.id, date: i.date, type: 'interes', concept: who, category: 'Intereses', amount: i.amount, sign: 0, note: i.note, createdAt: i.createdAt, ref: { c: 'interests', id: i.id, parent: d.id } }));
  });
  S.cards.forEach(c => (c.movements || []).forEach(m => L.push({ key: 'cm:' + m.id, date: m.date, type: m.type === 'pago' ? 'pago_tarjeta' : 'cargo_tarjeta', concept: c.name + (m.note ? ' · ' + m.note : ''), category: 'Tarjetas', amount: m.amount, sign: m.type === 'pago' && m.affectsBalance ? -1 : 0, note: m.note, createdAt: m.createdAt, ref: { c: 'cardmov', id: m.id, parent: c.id } })));
  return L.sort(byDateDesc);
}

function salesStats(r) {
  const list = S.sales.filter(s => inRange(s.date, r));
  const total = sum(list, 'total'); const cost = sum(list, s => s.qty * s.unitCost);
  const margin = r2(total - cost);
  return {
    list, total, cost, margin, pct: total > 0 ? margin / total * 100 : 0, count: list.length,
    units: list.reduce((a, s) => a + s.qty, 0),
    contado: sum(list.filter(s => s.payType === 'contado'), 'total'), credito: sum(list.filter(s => s.payType === 'credito'), 'total')
  };
}

function toast(msg, type = 'ok') {
  const root = $('#toast-root'); const el = document.createElement('div');
  const cls = type === 'error' ? 'border-rose-500/30 text-rose-200' : type === 'info' ? 'border-sky-500/30 text-sky-200' : 'border-emerald-500/30 text-emerald-200';
  const icon = type === 'error' ? 'triangle-alert' : type === 'info' ? 'info' : 'circle-check';
  el.className = `pop pointer-events-auto flex items-center gap-2.5 max-w-sm rounded-xl border bg-[#111827]/95 backdrop-blur px-4 py-3 text-sm shadow-2xl ${cls}`;
  el.innerHTML = `${ic(icon, 'w-4 h-4 shrink-0')}<span>${esc(msg)}</span>`;
  root.appendChild(el); icons();
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; setTimeout(() => el.remove(), 300); }, 3200);
}

let dlCounter = 0;
function fieldHTML(f, v) {
  let val = v[f.name] ?? f.default ?? '';
  const span = f.full ? 'col-span-2' : '';
  const dataF = `data-field="${f.name}"`;
  if (f.type === 'html') return `<div ${dataF} class="${span}">${f.html(v)}</div>`;
  if (f.type === 'checkbox') return `<label ${dataF} class="${span} flex items-start gap-3 rounded-lg border border-white/[0.06] bg-white/[0.02] px-3 py-2.5 cursor-pointer hover:bg-white/[0.04]">
      <input type="checkbox" name="${f.name}" ${val ? 'checked' : ''} class="mt-0.5 w-4 h-4 rounded accent-indigo-500">
      <span><span class="block text-sm text-slate-200">${f.label}</span>${f.hint ? `<span class="hint block">${f.hint}</span>` : ''}</span></label>`;
  const req = f.required ? 'required' : '';
  const dis = f.disabled ? 'disabled' : '';
  let input;
  if (f.type === 'select') {
    const opts = typeof f.options === 'function' ? f.options() : f.options;
    input = `<select name="${f.name}" class="inp" ${req} ${dis}>${opts.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(val) ? 'selected' : ''} ${o.disabled ? 'disabled' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if (f.type === 'segmented') {
    const opts = f.options; if (val === '' || val == null) val = opts[0].value;
    input = `<div class="grid grid-cols-${opts.length} gap-1 p-1 rounded-lg bg-[#0a0e15] border border-white/10">${opts.map(o => `
      <label class="cursor-pointer"><input type="radio" name="${f.name}" value="${esc(o.value)}" class="peer sr-only" ${String(o.value) === String(val) ? 'checked' : ''}>
      <span class="block text-center px-2 py-1.5 rounded-md text-xs font-medium text-slate-400 peer-checked:bg-indigo-500/20 peer-checked:text-indigo-100 peer-checked:ring-1 peer-checked:ring-indigo-400/30 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 transition">${esc(o.label)}</span></label>`).join('')}</div>`;
  } else if (f.type === 'textarea') {
    input = `<textarea name="${f.name}" rows="${f.rows || 2}" class="inp resize-y" placeholder="${esc(f.placeholder || '')}" ${dis}>${esc(val)}</textarea>`;
  } else {
    const isNum = f.type === 'number';
    const list = f.list && f.list.length ? `dl-${f.name}-${++dlCounter}` : '';
    input = `<input type="${f.type || 'text'}" name="${f.name}" value="${esc(val)}" ${isNum ? `step="${f.step || 'any'}" inputmode="${f.step === '1' ? 'numeric' : 'decimal'}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${list ? `list="${list}"` : ''} placeholder="${esc(f.placeholder || '')}" class="inp ${isNum ? 'tabular-nums' : ''}" ${req} ${dis} autocomplete="off">`
      + (list ? `<datalist id="${list}">${f.list.map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist>` : '');
  }
  return `<div ${dataF} class="${span}"><label class="lbl">${f.label}</label>${input}${f.hint ? `<p class="hint">${f.hint}</p>` : ''}</div>`;
}

function readForm(form, fields) {
  const v = {};
  fields.forEach(f => {
    if (f.type === 'html') return;
    if (f.type === 'segmented') { v[f.name] = form.querySelector(`[name="${f.name}"]:checked`)?.value; return; }
    const el = form.elements[f.name]; if (!el) return;
    if (f.type === 'checkbox') v[f.name] = el.checked;
    else if (f.type === 'number') v[f.name] = el.value === '' ? null : num(el.value);
    else v[f.name] = String(el.value || '').trim();
  });
  return v;
}

function bindForm(form, fields, { onInput, onSubmit }) {
  const errBox = form.querySelector('.form-error');
  const update = changed => {
    const v = readForm(form, fields);
    fields.forEach(f => {
      if (!f.show) return;
      const w = form.querySelector(`[data-field="${f.name}"]`); if (!w) return;
      const vis = !!f.show(v); w.classList.toggle('hidden', !vis);
      w.querySelectorAll('input,select,textarea').forEach(i => i.disabled = !vis || !!f.disabled);
    });
    if (onInput) onInput(v, form, changed);
  };
  form.addEventListener('input', e => update(e.target.name));
  form.addEventListener('change', e => update(e.target.name));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const err = onSubmit(readForm(form, fields));
    if (err && errBox) { errBox.innerHTML = `${ic('triangle-alert', 'w-4 h-4 shrink-0')}<span>${esc(err)}</span>`; errBox.classList.remove('hidden'); icons(); }
    else if (errBox) errBox.classList.add('hidden');
  });
  update(null);
}
const errorBox = () => `<div class="form-error hidden flex items-center gap-2 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200"></div>`;

}

    { name: 'name', label: 'Nombre / concepto del producto', type: 'text', required: true, full: true, placeholder: 'Ej. Pelotas económicas, DHS 3 estrellas…' },
    { name: 'stock', label: 'Unidades en inventario', type: 'number', step: '1', min: 0, required: true },
    { name: 'cost', label: 'Precio de costo (unitario)', type: 'number', min: 0, placeholder: '0.00' },
    { name: 'price', label: 'Precio de venta sugerido', type: 'number', min: 0, placeholder: '0.00' },
    { name: 'note', label: 'Nota', type: 'text', placeholder: 'Opcional' },
    { name: 'pv', type: 'html', full: true, html: () => '<div class="prod-preview"></div>' }
  ];
  openForm({
    title: p ? 'Editar producto' : 'Nuevo producto', icon: 'package', fields,
    values: p ? { ...p } : { stock: 0 }, submitLabel: p ? 'Guardar cambios' : 'Agregar producto',
    onInput: (v, form) => {
      const m = r2((v.price || 0) - (v.cost || 0)); const pct = v.price > 0 ? (m / v.price * 100) : 0;
      form.querySelector('.prod-preview').innerHTML = `<div class="grid grid-cols-3 gap-2">
        <div class="mini"><p class="mini-l">Margen unitario</p><p class="mini-v ${m >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${money(m)}</p></div>
        <div class="mini"><p class="mini-l">Margen %</p><p class="mini-v">${pct.toFixed(1)}%</p></div>
        <div class="mini"><p class="mini-l">Valor (costo)</p><p class="mini-v">${money((v.stock || 0) * (v.cost || 0))}</p></div></div>`;
    },
    onSubmit: v => {
      if (!v.name) return 'Escribe el nombre del producto';
      if (v.stock == null || v.stock < 0) return 'Las unidades no pueden ser negativas';
      const rec = p || { id: uid(), createdAt: Date.now() };
      const renamed = p && p.name !== v.name;
      Object.assign(rec, { name: v.name, stock: Math.floor(v.stock), cost: r2(v.cost || 0), price: r2(v.price || 0), note: v.note || '' });
      if (!p) S.products.push(rec);
      if (renamed) S.sales.forEach(s => { if (s.productId === rec.id) s.productName = rec.name; });
      commit(p ? 'Producto actualizado' : 'Producto agregado');
    }
  });
}
function setStock(id, value) {
  const p = find(S.products, id); if (!p) return;
  p.stock = Math.max(0, Math.floor(num(value))); commit();
}
function deleteProduct(id) {
  const p = find(S.products, id); if (!p) return;
  const n = S.sales.filter(s => s.productId === id).length;
  confirmBox({
    title: 'Eliminar producto',
    message: `¿Eliminar <b>${esc(p.name)}</b> del inventario?${n ? ` Tiene ${n} venta(s) registradas; se conservarán en el historial con su nombre.` : ''}`,
    onConfirm: () => { S.products = S.products.filter(x => x.id !== id); commit('Producto eliminado'); }
  });
}

/* =====================================================================
   OPERACIONES: VENTAS (descuento automático de stock + vínculo a créditos)
   ===================================================================== */
function availableFor(p, existing) { return p.stock + (existing && existing.productId === p.id ? existing.qty : 0); }

function saleFields(existing) {
  const opts = S.products.slice().sort((a, b) => a.name.localeCompare(b.name, 'es')).map(p => {
    const av = availableFor(p, existing);
    return { value: p.id, label: `${p.name} — ${av} u. disponibles`, disabled: av <= 0 };
  });
  if (existing && !find(S.products, existing.productId)) opts.unshift({ value: existing.productId, label: `${existing.productName} (producto eliminado)` });
  if (!existing) opts.unshift({ value: '', label: 'Selecciona un producto…' });
  const isNewCredit = v => v.payType === 'credito' && !(existing && existing.debtId);
  return [
    { name: 'productId', label: 'Producto del inventario', type: 'select', options: opts, required: true, full: true },
    { name: 'qty', label: 'Unidades vendidas', type: 'number', step: '1', min: 1, required: true },
    { name: 'unitPrice', label: 'Precio unitario de venta', type: 'number', min: 0, required: true, placeholder: '0.00' },
    { name: 'date', label: 'Fecha', type: 'date', required: true },
    { name: 'payType', label: 'Tipo de venta', type: 'segmented', options: [{ value: 'contado', label: 'Contado' }, { value: 'credito', label: 'A crédito' }] },
    { name: 'client', label: 'Cliente (deudor)', type: 'text', list: clientNames(), placeholder: 'Nombre del cliente', full: true, required: true, show: v => v.payType === 'credito' },
    { name: 'rate', label: 'Interés % por corte', type: 'number', min: 0, placeholder: '0', hint: 'Opcional, sobre saldo insoluto', show: isNewCredit },
    { name: 'cutDay', label: 'Día de corte (1-31)', type: 'number', step: '1', min: 1, max: 31, placeholder: '—', show: isNewCredit },
    { name: 'note', label: 'Nota', type: 'text', placeholder: 'Opcional', full: true },
    { name: 'pv', type: 'html', full: true, html: () => '<div class="sale-preview"></div>' }
  ];
}
function saleOnInput(existing) {
  return (v, form, changed) => {
    const p = find(S.products, v.productId);
    if (changed === 'productId' && p) { form.elements.unitPrice.value = p.price; v.unitPrice = p.price; }
    const box = form.querySelector('.sale-preview'); if (!box) return;
    const keepOld = existing && v.productId === existing.productId;
    if (!p && !keepOld) { box.innerHTML = `<p class="text-xs text-slate-500 flex items-center gap-1.5">${ic('info', 'w-3.5 h-3.5')} Al registrar, las unidades se descuentan automáticamente del stock.</p>`; icons(); return; }
    const qty = Math.max(0, Math.floor(v.qty || 0)); const total = r2(qty * (v.unitPrice || 0));
    const unitCost = keepOld ? existing.unitCost : p.cost;
    const left = p ? availableFor(p, existing) - qty : null;
    box.innerHTML = `<div class="grid grid-cols-3 gap-2">
      <div class="mini"><p class="mini-l">Total</p><p class="mini-v text-white">${money(total)}</p></div>
      <div class="mini"><p class="mini-l">Margen</p><p class="mini-v ${total - qty * unitCost >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${money(total - qty * unitCost)}</p></div>
      <div class="mini"><p class="mini-l">Stock restante</p><p class="mini-v ${left != null && left < 0 ? 'text-rose-300' : ''}">${left == null ? '—' : left + ' u.'}</p></div></div>`;
  };
}
function saveSale(v, existing) {
  const keepOld = existing && v.productId === existing.productId;
  const p = find(S.products, v.productId);
  if (!p && !keepOld) return 'Selecciona un producto del inventario';
  const qty = Math.floor(v.qty || 0);
  if (qty < 1) return 'La cantidad debe ser al menos 1';
  if (v.unitPrice == null || v.unitPrice < 0) return 'Indica un precio de venta válido';
  if (p) { const av = availableFor(p, existing); if (qty > av) return `Stock insuficiente: solo hay ${av} unidad(es) de "${p.name}"`; }
  const payType = v.payType === 'credito' ? 'credito' : 'contado';
  if (payType === 'credito' && !v.client) return 'Indica el nombre del cliente para la venta a crédito';
  const oldDebt = existing && existing.debtId ? find(S.debts, existing.debtId) : null;
  if (existing && existing.payType === 'credito' && payType === 'contado' && oldDebt && oldDebt.payments.length)
    return 'Esta venta tiene abonos registrados. Elimínalos en Préstamos y Deudas antes de cambiarla a contado.';
  if (v.cutDay && (v.cutDay < 1 || v.cutDay > 31)) return 'El día de corte debe estar entre 1 y 31';

  // Revertir stock anterior y aplicar el nuevo
  if (existing) { const op = find(S.products, existing.productId); if (op) op.stock += existing.qty; }
  if (p) p.stock -= qty;

  const sale = existing || { id: uid(), createdAt: Date.now() };
  Object.assign(sale, {
    productId: v.productId, productName: p ? p.name : existing.productName, qty, unitPrice: r2(v.unitPrice),
    unitCost: keepOld ? existing.unitCost : (p ? p.cost : 0), total: r2(qty * v.unitPrice), date: v.date || today(),
    payType, client: payType === 'credito' ? v.client : '', note: v.note || ''
  });
  if (!existing) S.sales.push(sale);

  if (payType === 'credito') {
    let d = oldDebt;
    if (!d) {
      d = { id: uid(), createdAt: Date.now(), kind: 'credito_venta', payments: [], interests: [], skipCuts: [], saleId: sale.id,
        rate: r2(v.rate || 0), cutDay: Math.floor(v.cutDay || 0), autoInterest: (v.rate || 0) > 0 && !!v.cutDay, affectsBalance: false, dueDate: '', note: '' };
      S.debts.push(d); sale.debtId = d.id;
    }
    Object.assign(d, { person: v.client, concept: `Venta: ${sale.productName} × ${qty}`, principal: sale.total, startDate: sale.date });
  } else if (oldDebt) {
    S.debts = S.debts.filter(x => x.id !== oldDebt.id); delete sale.debtId;
  }
}
function openSaleForm(existing, preset = {}) {
  if (!S.products.length && !existing) { toast('Primero agrega un producto al inventario', 'info'); go('inventario'); return; }
  const values = existing ? { ...existing } : { date: today(), payType: 'contado', qty: 1, ...preset };
  openForm({
    title: existing ? 'Editar venta' : 'Registrar venta', icon: 'shopping-cart', fields: saleFields(existing), values,
    submitLabel: existing ? 'Guardar cambios' : 'Registrar venta', onInput: saleOnInput(existing),
    onSubmit: v => { const err = saveSale(v, existing); if (err) return err; commit(existing ? 'Venta actualizada' : 'Venta registrada · stock actualizado'); }
  });
}
function deleteSale(id, after) {
  const s = find(S.sales, id); if (!s) return;
  const d = s.debtId ? find(S.debts, s.debtId) : null;
  confirmBox({
    title: 'Eliminar venta',
    message: `Se eliminará la venta de <b>${esc(s.productName)} × ${s.qty}</b> (${money(s.total)}) y se devolverán las unidades al inventario.${d ? `<br><br>También se eliminará la cuenta por cobrar de <b>${esc(d.person)}</b>${d.payments.length ? ` con ${d.payments.length} abono(s)` : ''}.` : ''}`,
    onConfirm: () => {
      const p = find(S.products, s.productId); if (p) p.stock += s.qty;
      S.sales = S.sales.filter(x => x.id !== id);
      if (d) S.debts = S.debts.filter(x => x.id !== d.id);
      commit('Venta eliminada · stock restaurado'); after && after();
    }
  });
}

/* =====================================================================
   OPERACIONES: PRÉSTAMOS / DEUDAS / CRÉDITOS
   ===================================================================== */
function openDebtForm(existing, kind = 'prestamo') {
  const locked = existing && existing.kind === 'credito_venta';
  const fields = [
    ...(locked
      ? [{ name: 'info', type: 'html', full: true, html: () => `<div class="rounded-lg border border-violet-500/20 bg-violet-500/[0.06] p-3 text-xs text-violet-200 flex gap-2">${ic('info', 'w-4 h-4 shrink-0')}<span>Cuenta generada por una venta a crédito. El monto inicial se ajusta editando la venta.</span></div>` }]
      : [{ name: 'kind', label: 'Tipo de registro', type: 'segmented', full: true, options: [{ value: 'prestamo', label: 'Préstamo que otorgué' }, { value: 'deuda', label: 'Mi deuda / préstamo' }] }]),
    { name: 'person', label: 'Persona o entidad', type: 'text', required: true, list: clientNames(), placeholder: 'Ej. Carlos, Banco, Tienda…' },
    { name: 'concept', label: 'Concepto', type: 'text', placeholder: 'Ej. Préstamo personal' },
    { name: 'principal', label: 'Monto inicial', type: 'number', min: 0, required: !locked, disabled: locked, placeholder: '0.00' },
    { name: 'startDate', label: 'Fecha de inicio', type: 'date', required: true },
    { name: 'rate', label: 'Tasa de interés % (por corte)', type: 'number', min: 0, placeholder: '0' },
    { name: 'cutDay', label: 'Día de corte (1-31)', type: 'number', step: '1', min: 1, max: 31, placeholder: '—' },
    { name: 'dueDate', label: 'Fecha límite (opcional)', type: 'date', full: false },
    { name: 'autoInterest', label: 'Aplicar interés automáticamente en cada fecha de corte', hint: 'Se calcula solo sobre el saldo insoluto (monto inicial − abonos). Puedes editar cada interés después.', type: 'checkbox', full: true },
    ...(!locked ? [{ name: 'affectsBalance', type: 'checkbox', full: true, label: 'Reflejar la entrega/recepción del dinero en el balance', hint: 'Préstamo otorgado: resta del balance · Mi deuda: suma el dinero recibido.' }] : []),
    ...(existing && existing.skipCuts && existing.skipCuts.length ? [{ name: 'restoreCuts', type: 'checkbox', full: true, label: `Restaurar ${existing.skipCuts.length} interés(es) automático(s) eliminados` }] : []),
    { name: 'note', label: 'Notas', type: 'textarea', full: true, placeholder: 'Opcional' },
    { name: 'pv', type: 'html', full: true, html: () => '<div class="debt-preview"></div>' }
  ];
  const values = existing ? { ...existing } : { kind, startDate: today(), autoInterest: true, affectsBalance: true };
  openForm({
    title: existing ? 'Editar registro' : 'Nuevo préstamo / deuda', icon: 'hand-coins', fields, values,
    submitLabel: existing ? 'Guardar cambios' : 'Crear registro',
    onInput: (v, form) => {
      const principal = locked ? existing.principal : (v.principal || 0);
      const paid = existing ? sum(existing.payments, 'amount') : 0;
      const ins = Math.max(0, r2(principal - paid)); const est = r2(ins * (v.rate || 0) / 100);
      const nc = v.cutDay ? nextOcc(Math.floor(v.cutDay), addDays(today(), 1)) : null;
      form.querySelector('.debt-preview').innerHTML = `<div class="grid grid-cols-3 gap-2">
        <div class="mini"><p class="mini-l">Saldo insoluto</p><p class="mini-v">${money(ins)}</p></div>
        <div class="mini"><p class="mini-l">Interés por corte</p><p class="mini-v text-amber-300">${money(est)}</p></div>
        <div class="mini"><p class="mini-l">Próximo corte</p><p class="mini-v">${nc ? fmtShort(nc) : '—'}</p></div></div>`;
    },
    onSubmit: v => {
      if (!v.person) return 'Indica la persona o entidad';
      if (!locked && !(v.principal > 0)) return 'El monto inicial debe ser mayor a 0';
      if (v.cutDay && (v.cutDay < 1 || v.cutDay > 31)) return 'El día de corte debe estar entre 1 y 31';
      if (v.autoInterest && v.rate > 0 && !v.cutDay) return 'Define un día de corte para aplicar el interés automático';
      const d = existing || { id: uid(), createdAt: Date.now(), payments: [], interests: [], skipCuts: [] };
      Object.assign(d, {
        kind: locked ? d.kind : (v.kind || 'prestamo'), person: v.person, concept: v.concept || '', startDate: v.startDate || today(),
        dueDate: v.dueDate || '', rate: r2(v.rate || 0), cutDay: Math.floor(v.cutDay || 0), autoInterest: !!v.autoInterest, note: v.note || ''
      });
      if (!locked) { d.principal = r2(v.principal); d.affectsBalance = !!v.affectsBalance; }
      if (v.restoreCuts) d.skipCuts = [];
      if (!existing) S.debts.push(d);
      commit(existing ? 'Registro actualizado' : 'Registro creado');
    }
  });
}
function deleteDebt(id) {
  const d = find(S.debts, id); if (!d) return;
  if (d.kind === 'credito_venta' && d.saleId && find(S.sales, d.saleId)) { deleteSale(d.saleId); return; }
  confirmBox({
    title: 'Eliminar registro',
    message: `¿Eliminar el registro de <b>${esc(d.person)}</b>?${d.payments.length ? ` Se eliminarán también ${d.payments.length} abono(s) y su efecto en el balance.` : ''}`,
    onConfirm: () => { S.debts = S.debts.filter(x => x.id !== id); UI.expanded = UI.expanded.filter(x => x !== id); commit('Registro eliminado'); }
  });
}
function openPaymentForm(d, pay) {
  const c = debtCalc(d); const max = r2(c.saldo + (pay ? pay.amount : 0));
  openForm({
    title: `${pay ? 'Editar abono' : 'Registrar abono'} · ${esc(d.person)}`, icon: 'banknote',
    values: pay ? { ...pay } : { amount: c.saldo, date: today() },
    fields: [
      { name: 'amount', label: 'Monto del abono', type: 'number', min: 0, required: true },
      { name: 'date', label: 'Fecha', type: 'date', required: true },
      { name: 'note', label: 'Nota', type: 'text', full: true, placeholder: 'Opcional (ej. transferencia, efectivo…)' },
      { name: 'pv', type: 'html', full: true, html: () => '<div class="pay-preview"></div>' }
    ],
    onInput: (v, form) => {
      const after = r2(max - (v.amount || 0));
      form.querySelector('.pay-preview').innerHTML = `<div class="grid grid-cols-2 gap-2">
        <div class="mini"><p class="mini-l">Saldo actual</p><p class="mini-v">${money(max)}</p></div>
        <div class="mini"><p class="mini-l">Saldo después del abono</p><p class="mini-v ${after < 0 ? 'text-rose-300' : after === 0 ? 'text-emerald-300' : ''}">${money(after)}</p></div></div>`;
    },
    onSubmit: v => {
      if (!(v.amount > 0)) return 'El abono debe ser mayor a 0';
      if (v.amount > max + 0.005) return `El abono excede el saldo pendiente (${money(max)})`;
      const p = pay || { id: uid(), createdAt: Date.now() };
      Object.assign(p, { amount: r2(v.amount), date: v.date || today(), note: v.note || '' });
      if (!pay) d.payments.push(p);
      commit(pay ? 'Abono actualizado' : 'Abono registrado · saldos recalculados');
    }
  });
}
function deletePayment(d, pid) {
  const p = find(d.payments, pid); if (!p) return;
  confirmBox({ title: 'Eliminar abono', message: `¿Eliminar el abono de <b>${money(p.amount)}</b> del ${fmtDate(p.date)}? El saldo se recalculará.`,
    onConfirm: () => { d.payments = d.payments.filter(x => x.id !== pid); commit('Abono eliminado'); } });
}
function settleDebt(d) {
  const c = debtCalc(d); if (c.saldo <= 0) return;
  confirmBox({ title: 'Liquidar saldo', danger: false, confirmLabel: 'Registrar pago total',
    message: `Se registrará un abono por <b>${money(c.saldo)}</b> con fecha de hoy y el registro quedará como <b>Pagado</b>.`,
    onConfirm: () => { d.payments.push({ id: uid(), createdAt: Date.now(), amount: c.saldo, date: today(), note: 'Liquidación total' }); commit('Saldo liquidado'); } });
}
function openInterestForm(d, item) {
  const c = debtCalc(d);
  const isAuto = item && item.auto;
  const fields = [
    { name: 'date', label: isAuto ? 'Fecha de corte' : 'Fecha', type: 'date', required: true, disabled: isAuto },
    { name: 'rate', label: 'Tasa %', type: 'number', min: 0 },
    { name: 'base', label: 'Saldo insoluto (base)', type: 'number', min: 0, hint: `Saldo insoluto actual: ${money(c.insoluto)}` },
    { name: 'amount', label: 'Interés aplicado (editable)', type: 'number', min: 0, required: true },
    ...(isAuto ? [{ name: 'autoCalc', type: 'checkbox', full: true, label: 'Mantener cálculo automático', hint: 'Si lo desactivas, el monto queda fijo aunque cambien los abonos.' }] : []),
    { name: 'note', label: 'Nota', type: 'text', full: true, placeholder: 'Opcional' }
  ];
  const values = item ? { ...item, autoCalc: !item.manual } : { date: today(), rate: d.rate, base: c.insoluto, amount: r2(c.insoluto * d.rate / 100) };
  openForm({
    title: `${item ? 'Editar interés' : 'Aplicar interés'} · ${esc(d.person)}`, icon: 'percent', fields, values,
    onInput: (v, form, changed) => {
      if (changed === 'rate' || changed === 'base') { form.elements.amount.value = r2((v.base || 0) * (v.rate || 0) / 100).toFixed(2); if (form.elements.autoCalc && changed === 'base') form.elements.autoCalc.checked = false; }
      if (changed === 'amount' && form.elements.autoCalc) form.elements.autoCalc.checked = false;
    },
    onSubmit: v => {
      if (v.amount == null || v.amount < 0) return 'Indica un monto de interés válido';
      const it = item || { id: uid(), createdAt: Date.now(), auto: false };
      Object.assign(it, { amount: r2(v.amount), base: r2(v.base || 0), rate: r2(v.rate || 0), note: v.note || '' });
      if (!isAuto) it.date = v.date || today();
      it.manual = isAuto ? !v.autoCalc : true;
      if (!item) d.interests.push(it);
      commit(item ? 'Interés actualizado' : 'Interés aplicado');
    }
  });
}
function deleteInterest(d, iid) {
  const it = find(d.interests, iid); if (!it) return;
  confirmBox({ title: 'Eliminar interés', message: `¿Eliminar el interés de <b>${money(it.amount)}</b> (${fmtDate(it.date)})?${it.auto ? ' Este corte automático no volverá a generarse (puedes restaurarlo editando el registro).' : ''}`,
    onConfirm: () => { if (it.auto) d.skipCuts = [...new Set([...(d.skipCuts || []), it.date])]; d.interests = d.interests.filter(x => x.id !== iid); commit('Interés eliminado'); } });
}

/* =====================================================================
   OPERACIONES: GASTOS / INGRESOS
   ===================================================================== */
function movFields(col) {
  const items = S[col]; const isExp = col === 'expenses';
  return [
    { name: 'date', label: 'Fecha', type: 'date', required: true },
    { name: 'amount', label: 'Monto', type: 'number', min: 0, required: true, placeholder: '0.00' },
    { name: 'concept', label: 'Concepto', type: 'text', required: true, full: true, list: uniq(items.map(x => x.concept)), placeholder: isExp ? 'Ej. Pasaje de camión, comida…' : 'Ej. Pago de cliente, servicio…' },
    { name: 'category', label: 'Categoría', type: 'text', full: true, list: uniq([...(isExp ? EXP_CATS : INC_CATS), ...items.map(x => x.category)]), placeholder: isExp ? 'Ej. Transporte' : 'Ej. Servicios' },
    { name: 'note', label: 'Nota', type: 'text', full: true, placeholder: 'Opcional' }
  ];
}
function saveMov(col, v, existing) {
  if (!v.concept) return 'Escribe un concepto';
  if (!(v.amount > 0)) return 'El monto debe ser mayor a 0';
  const rec = existing || { id: uid(), createdAt: Date.now() };
  Object.assign(rec, { date: v.date || today(), concept: v.concept, category: v.category || 'General', amount: r2(v.amount), note: v.note || '' });
  if (!existing) S[col].push(rec);
}
function openMovForm(col, existing) {
  const isExp = col === 'expenses';
  openForm({
    title: `${existing ? 'Editar' : 'Registrar'} ${isExp ? 'gasto' : 'ingreso'}`, icon: isExp ? 'receipt' : 'arrow-down-left',
    fields: movFields(col), values: existing ? { ...existing } : { date: today() },
    onSubmit: v => { const err = saveMov(col, v, existing); if (err) return err; commit(`${isExp ? 'Gasto' : 'Ingreso'} ${existing ? 'actualizado' : 'registrado'}`); }
  });
}
function deleteMov(col, id) {
  const r = find(S[col], id); if (!r) return;
  confirmBox({ title: `Eliminar ${col === 'expenses' ? 'gasto' : 'ingreso'}`, message: `¿Eliminar <b>${esc(r.concept)}</b> por ${money(r.amount)} (${fmtDate(r.date)})?`,
    onConfirm: () => { S[col] = S[col].filter(x => x.id !== id); commit('Registro eliminado'); } });

/* =====================================================================

function openCardForm(c) {
  openForm({
    title: c ? 'Editar tarjeta / cuenta' : 'Nueva tarjeta o cuenta digital', icon: 'credit-card',
    values: c ? { ...c } : { kind: 'credito', color: 'indigo', baseUsed: 0, cutBalance: 0 },
    fields: [
      { name: 'name', label: 'Nombre', type: 'text', required: true, full: true, placeholder: 'Ej. Tarjeta Oro, Cuenta digital…' },
      { name: 'kind', label: 'Tipo', type: 'segmented', full: true, options: [{ value: 'credito', label: 'Tarjeta de crédito' }, { value: 'digital', label: 'Cuenta digital' }] },
      { name: 'limit', label: 'Límite de crédito', type: 'number', min: 0, required: true },
      { name: 'baseUsed', label: 'Saldo utilizado actual', type: 'number', min: 0, hint: 'Lo usado antes de registrar movimientos' },
      { name: 'cutBalance', label: 'Saldo al corte', type: 'number', min: 0 },
      { name: 'color', label: 'Color', type: 'select', options: COLOR_OPTS.map(([value, label]) => ({ value, label })) },
      { name: 'cutDay', label: 'Día de corte (1-31)', type: 'number', step: '1', min: 1, max: 31 },
      { name: 'payDay', label: 'Día límite de pago (1-31)', type: 'number', step: '1', min: 1, max: 31 }
    ],
    onSubmit: v => {
      if (!v.name) return 'Escribe un nombre';
      if (v.limit == null || v.limit < 0) return 'Indica un límite válido';
      for (const k of ['cutDay', 'payDay']) if (v[k] && (v[k] < 1 || v[k] > 31)) return 'Los días deben estar entre 1 y 31';
      const rec = c || { id: uid(), createdAt: Date.now(), movements: [] };
      Object.assign(rec, { name: v.name, kind: v.kind, limit: r2(v.limit), baseUsed: r2(v.baseUsed || 0), cutBalance: r2(v.cutBalance || 0), color: v.color, cutDay: Math.floor(v.cutDay || 0), payDay: Math.floor(v.payDay || 0) });
      if (!c) S.cards.push(rec);
      commit(c ? 'Tarjeta actualizada' : 'Tarjeta agregada');
    }
  });
}
function openCardMovForm(c, m, type = 'cargo') {
  const k = cardCalc(c);
  openForm({
    title: `${m ? 'Editar movimiento' : (type === 'pago' ? 'Registrar pago' : 'Registrar cargo')} · ${esc(c.name)}`, icon: 'credit-card',
    values: m ? { ...m } : { type, date: today(), amount: type === 'pago' ? k.pendingCut || '' : '', affectsBalance: true },
    fields: [
      { name: 'type', label: 'Movimiento', type: 'segmented', full: true, options: [{ value: 'cargo', label: 'Cargo / compra' }, { value: 'pago', label: 'Pago a la tarjeta' }] },
      { name: 'amount', label: 'Monto', type: 'number', min: 0, required: true },
      { name: 'date', label: 'Fecha', type: 'date', required: true },
      { name: 'note', label: 'Descripción', type: 'text', full: true, placeholder: 'Opcional' },
      { name: 'affectsBalance', type: 'checkbox', full: true, label: 'Descontar este pago de mi balance', show: v => v.type === 'pago' }

      if (!(v.amount > 0)) return 'El monto debe ser mayor a 0';

function openCardHistory(c) {

function deleteCard(id) {
  const c = find(S.cards, id); if (!c) return;
  confirmBox({ title: 'Eliminar tarjeta', message: `¿Eliminar <b>${esc(c.name)}</b> y sus ${c.movements.length} movimiento(s)?`, onConfirm: () => { S.cards = S.cards.filter(x => x.id !== id); commit('Tarjeta eliminada'); } });
}

/* Edición / eliminación universal desde el reporte */
function editRef({ c, id, parent }) {
  closeModal();
  if (c === 'incomes' || c === 'expenses') { const r = find(S[c], id); r && openMovForm(c, r); }
  else if (c === 'sales') { const r = find(S.sales, id); r && openSaleForm(r); }
  else if (c === 'debts') { const r = find(S.debts, id); r && openDebtForm(r); }
  else if (c === 'payments') { const d = find(S.debts, parent); const p = d && find(d.payments, id); p && openPaymentForm(d, p); }
  else if (c === 'interests') { const d = find(S.debts, parent); const i = d && find(d.interests, id); i && openInterestForm(d, i); }
  else if (c === 'cardmov') { const k = find(S.cards, parent); const m = k && find(k.movements, id); m && openCardMovForm(k, m); }
}
function deleteRef({ c, id, parent }) {
  closeModal();
  if (c === 'incomes' || c === 'expenses') deleteMov(c, id);
  else if (c === 'sales') deleteSale(id);
  else if (c === 'debts') deleteDebt(id);
  else if (c === 'payments') { const d = find(S.debts, parent); d && deletePayment(d, id); }
  else if (c === 'interests') { const d = find(S.debts, parent); d && deleteInterest(d, id); }
  else if (c === 'cardmov') {
    const k = find(S.cards, parent); const m = k && find(k.movements, id); if (!m) return;
    confirmBox({ title: 'Eliminar movimiento', message: `¿Eliminar el ${m.type} de <b>${money(m.amount)}</b> (${fmtDate(m.date)})?`, onConfirm: () => { k.movements = k.movements.filter(x => x.id !== id); commit('Movimiento eliminado'); } });
  }
}

const EXP_PERIODS = [['semanal', 'Semanal'], ['quincenal', 'Quincenal'], ['mensual', 'Mensual'], ['custom', 'Personalizado']];
function viewExpenses() {
  const E = UI.exp; const r = rangeFor(E.period, E.anchor, E.from, E.to);
  const list = S.expenses.filter(e => inRange(e.date, r)).sort(byDateDesc);
  const total = sum(list, 'amount');
  const effEnd = r.end > today() ? today() : r.end;
  const effStart = r.start === ALL.start ? (list.length ? list[list.length - 1].date : today()) : r.start;
  const days = Math.max(1, daysBetween(effStart, effEnd) + 1);
  let prev = '';
  if (E.period !== 'custom') {
    const pr = rangeFor(E.period, addDays(r.start, -1)); const pt = sum(S.expenses.filter(e => inRange(e.date, pr)), 'amount');
    const ch = pt > 0 ? (total - pt) / pt * 100 : null;
    prev = `${money(pt)}${ch != null ? `<span class="block text-[11px] font-medium ${ch > 0 ? 'text-rose-300' : 'text-emerald-300'}">${ch > 0 ? '+' : ''}${ch.toFixed(0)}% este periodo</span>` : ''}`;
  }
  const cats = {}; list.forEach(e => { const k = e.category || 'General'; cats[k] = (cats[k] || 0) + e.amount; });
  const catArr = Object.entries(cats).sort((a, b) => b[1] - a[1]); const cmax = catArr[0]?.[1] || 1;
  // Historial continuo acumulado
  const hp = E.period === 'custom' ? 'mensual' : E.period; const hist = []; let a = today();
  for (let i = 0; i < 12; i++) { const rr = rangeFor(hp, a); const it = S.expenses.filter(e => inRange(e.date, rr)); hist.push({ rr, total: sum(it, 'amount'), n: it.length }); a = addDays(rr.start, -1); }
  const hmax = Math.max(...hist.map(h => h.total), 1);
  const grand = sum(S.expenses, 'amount');
  // Frecuentes
  const freq = {}; S.expenses.slice().sort(byDateDesc).forEach(e => { const k = e.concept.toLowerCase(); if (!freq[k]) freq[k] = { ...e, n: 0 }; freq[k].n++; });

    <section class="panel p-5 xl:sticky xl:top-20">

        ${errorBox()}
        <button type="submit" class="btn btn-primary w-full">${ic('plus')}Agregar gasto</button>
      </form>
      ${top.length ? `<div class="mt-5 pt-5 border-t border-white/[0.06]"><p class="text-xs text-slate-500 mb-2 flex items-center gap-1.5">${ic('zap', 'w-3.5 h-3.5')}Gastos frecuentes (clic para rellenar)</p>
        <div class="flex flex-wrap gap-2">${top.map(t => `<button type="button" class="btn btn-ghost btn-sm !rounded-full" data-action="exp-fill" data-concept="${esc(t.concept)}" data-category="${esc(t.category || '')}" data-amount="${t.amount}">${esc(t.concept)} <span class="text-slate-500 tabular-nums">${money(t.amount)}</span></button>`).join('')}</div></div>` : ''}
    </section>
    <div class="xl:col-span-2 space-y-4">
      <section class="panel p-5">
        <div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="h2">${rangeLabel(E.period, r)}</h2><span class="sub">${list.length} gasto(s)</span></div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
          ${mini('Total del periodo', money(total), 'text-rose-300')}${mini('Promedio diario', money(total / days))}${mini('Registros', fmtInt(list.length))}${mini(E.period === 'custom' ? 'Acumulado histórico' : 'Periodo anterior', E.period === 'custom' ? money(grand) : prev)}
        </div>
        ${catArr.length ? `<div class="mt-5"><p class="text-xs text-slate-400 mb-3">Por categoría</p><div class="space-y-2.5">${catArr.map(([k, v]) => `
          <div class="group relative grid grid-cols-[minmax(80px,140px)_1fr_auto] items-center gap-3 text-sm"><span class="truncate text-slate-300">${esc(k)}</span>
          <div class="h-2 rounded-full bg-white/[0.04]"><div class="h-full rounded-full bg-rose-400/80 group-hover:bg-rose-300 transition-colors" style="width:${v / cmax * 100}%"></div></div>
          <span class="tabular-nums text-slate-200 w-28 text-right">${money(v)} <span class="text-[11px] text-slate-500">${(v / total * 100).toFixed(0)}%</span></span></div>`).join('')}</div></div>` : ''}
      </section>
      <section class="panel overflow-hidden">
        ${list.length ? `<div class="overflow-x-auto"><table class="tbl tbl-m"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th class="!text-right">Monto</th><th></th></tr></thead><tbody>
          ${list.map(e => `<tr><td data-label="Fecha" class="text-slate-400">${fmtDate(e.date)}</td><td class="m-title !whitespace-normal min-w-[140px]"><p class="text-slate-100">${esc(e.concept)}</p>${e.note ? `<p class="text-xs text-slate-500">${esc(e.note)}</p>` : ''}</td>
          <td data-label="Categoría"><span class="badge text-slate-300 bg-white/5 border-white/10">${ic('tag', 'w-3 h-3')}${esc(e.category || 'General')}</span></td><td data-label="Monto" class="text-right tabular-nums text-rose-300 font-medium">−${money(e.amount)}</td>
          <td class="text-right m-actions"><button class="icon-btn" data-action="tx-edit" data-c="expenses" data-id="${e.id}">${ic('pencil')}</button><button class="icon-btn danger" data-action="tx-del" data-c="expenses" data-id="${e.id}">${ic('trash-2')}</button></td></tr>`).join('')}

      </section>
      <section class="panel p-5">
        ${sectionHead('history', 'indigo', 'Historial continuo acumulado', `Últimos 12 periodos (${EXP_PERIODS.find(p => p[0] === hp)[1].toLowerCase()}) · Total histórico ${money(grand)}`)}

            <span class="tabular-nums w-32 text-right ${h.total ? 'text-slate-100' : 'text-slate-600'}">${money(h.total)} <span class="text-[11px] text-slate-500">${h.n}</span></span></button>`;
        }).join('')}</div>
      </section>
    </div>
  </div>`;
}

const REP_PERIODS = [['semanal', 'Semanal'], ['quincenal', 'Quincenal'], ['mensual', 'Mensual'], ['total', 'Histórico total'], ['custom', 'Personalizado']];

}

function exportCSV() {
  const rows = reportRows();

        <div class="mini !p-3.5"><p class="text-slate-200 font-medium flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-sky-500/15 text-sky-300 text-xs flex items-center justify-center">2</span>Toca ${ic('share', 'w-4 h-4 text-sky-300')} Compartir</p><p class="text-xs text-slate-500 mt-1.5 leading-relaxed">Elige <b class="text-slate-300">“Agregar a pantalla de inicio”</b> y confirma con <b class="text-slate-300">Agregar</b>.</p></div>
        <div class="mini !p-3.5"><p class="text-slate-200 font-medium flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-sky-500/15 text-sky-300 text-xs flex items-center justify-center">3</span>Ábrela desde el ícono</p><p class="text-xs text-slate-500 mt-1.5 leading-relaxed">Se abre a pantalla completa y funciona sin internet tras la primera apertura.</p></div>
      </div>
      <div class="mt-3 rounded-xl border border-amber-500/20 bg-amber-500/[0.05] p-3.5 text-xs text-amber-100/90 leading-relaxed flex gap-2.5">${ic('info', 'w-4 h-4 shrink-0 text-amber-300 mt-0.5')}<span>En iOS, la app instalada y Safari guardan sus datos <b>por separado</b>. Si ya registraste información en Safari, expórtala aquí y luego impórtala dentro de la app instalada. Guarda copias de seguridad con frecuencia en <b>Archivos / iCloud Drive</b>: borrar la app o los datos de Safari también borra la información.</span></div>
    </section>
    <section class="panel p-5 lg:col-span-2">
      ${sectionHead('triangle-alert', 'rose', 'Zona de datos', 'Acciones que reemplazan tu información',
        `<button class="btn btn-ghost btn-sm" data-action="load-sample">${ic('sparkles', 'w-3.5 h-3.5')}Cargar datos de ejemplo</button><button class="btn btn-danger btn-sm" data-action="reset-all">${ic('trash-2', 'w-3.5 h-3.5')}Borrar todos los datos</button>`)}
    </section>
  </div>`;
}
function mountSettings() {
  const form = $('#settings-form'); const fields = SETTINGS_FIELDS();
  bindForm(form, fields, { onSubmit: v => { S.settings.currency = v.currency || 'MXN'; S.settings.initialBalance = r2(v.initialBalance || 0); S.settings.lowStock = Math.max(0, Math.floor(v.lowStock || 0)); commit('Preferencias guardadas'); } });
}
function download(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/* En iPhone usa la hoja de Compartir (Guardar en Archivos / iCloud Drive / AirDrop / WhatsApp…). */
async function saveFile(name, content, type) {
  let file = null;
  try { file = new File([content], name, { type }); } catch { /* navegadores antiguos */ }
  if (IS_IOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  download(name, content, type); return true;
}
async function exportJSON() {
  const ts = new Date().toISOString();
  const content = JSON.stringify({ app: 'finanzas-inventario', version: 1, exportedAt: ts, data: { ...S, settings: { ...S.settings, lastBackup: ts } } }, null, 2);
  const ok = await saveFile(`respaldo-finanzas-${today()}.json`, content, 'application/json');
  if (ok) { S.settings.lastBackup = ts; save(); toast('Copia de seguridad lista'); render(); }
}
function importFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = normalize(JSON.parse(reader.result)); } catch (e) { toast('No se pudo importar: ' + e.message, 'error'); return; }
    confirmBox({ title: 'Importar datos', danger: false, confirmLabel: 'Reemplazar e importar',
      message: `El archivo contiene ${data.products.length} producto(s), ${data.sales.length} venta(s), ${data.debts.length} préstamo(s)/deuda(s), ${data.expenses.length} gasto(s) y ${data.cards.length} tarjeta(s).<br><br>Tus datos actuales serán <b>reemplazados</b>. Te recomendamos exportar una copia antes.`,
      onConfirm: () => { S = data; commit('Datos importados correctamente'); } });
  };
  reader.readAsText(file);
}
function loadSample() {
  const go2 = () => {
    S = defaultState(); S.settings.initialBalance = 5000; const t = today();
    const P = (name, stock, cost, price) => { const p = { id: uid(), createdAt: Date.now(), name, stock, cost, price, note: '' }; S.products.push(p); return p; };
    const p1 = P('Pelotas económicas', 60, 25, 45), p2 = P('DHS 3 estrellas', 36, 38, 65), p3 = P('Raqueta básica', 12, 180, 320), p4 = P('Grip antideslizante', 4, 15, 35);
    [[p1, 6, 45, -20], [p2, 10, 65, -14], [p3, 2, 320, -9], [p1, 12, 42, -6], [p4, 3, 35, -3], [p2, 4, 65, -1], [p1, 5, 45, 0]].forEach(([p, q, pr, off]) => saveSale({ productId: p.id, qty: q, unitPrice: pr, date: addDays(t, off), payType: 'contado' }, null));
    saveSale({ productId: p3.id, qty: 2, unitPrice: 310, date: addDays(t, -40), payType: 'credito', client: 'Club Deportivo Norte', rate: 3, cutDay: 5 }, null);
    saveSale({ productId: p2.id, qty: 6, unitPrice: 60, date: addDays(t, -5), payType: 'credito', client: 'Juan Pérez' }, null);
    const cr = S.debts.find(d => d.person === 'Club Deportivo Norte'); cr.payments.push({ id: uid(), createdAt: Date.now(), amount: 250, date: addDays(t, -20), note: 'Transferencia' });
    S.debts.push({ id: uid(), createdAt: Date.now(), kind: 'prestamo', person: 'Carlos Méndez', concept: 'Préstamo personal', principal: 2000, startDate: addDays(t, -75), dueDate: addDays(t, 30), rate: 5, cutDay: 15, autoInterest: true, affectsBalance: true, note: '', payments: [{ id: uid(), createdAt: Date.now(), amount: 500, date: addDays(t, -30), note: 'Efectivo' }], interests: [], skipCuts: [] });
    S.debts.push({ id: uid(), createdAt: Date.now(), kind: 'deuda', person: 'Préstamo familiar', concept: 'Compra de mercancía', principal: 4000, startDate: addDays(t, -50), dueDate: '', rate: 0, cutDay: 0, autoInterest: false, affectsBalance: true, note: '', payments: [{ id: uid(), createdAt: Date.now(), amount: 1000, date: addDays(t, -10), note: '' }], interests: [], skipCuts: [] });
    const E = (off, concept, category, amount) => S.expenses.push({ id: uid(), createdAt: Date.now(), date: addDays(t, off), concept, category, amount, note: '' });
    for (let i = 0; i < 30; i++) { if (i % 7 === 6) continue; E(-i, 'Pasaje de camión', 'Transporte', 24); if (i % 2 === 0) E(-i, 'Comida', 'Comida', 85 + (i % 3) * 15); }
    E(-4, 'Bolsas y etiquetas', 'Insumos', 120); E(-18, 'Recarga celular', 'Servicios', 100); E(-25, 'Cinta y empaque', 'Insumos', 65);
    S.incomes.push({ id: uid(), createdAt: Date.now(), date: addDays(t, -15), concept: 'Pago por clases', category: 'Servicios', amount: 1500, note: '' });
    S.cards.push({ id: uid(), createdAt: Date.now(), name: 'Tarjeta Oro', kind: 'credito', limit: 15000, baseUsed: 3200, cutBalance: 2800, cutDay: 10, payDay: 30, color: 'indigo', movements: [{ id: uid(), createdAt: Date.now(), type: 'cargo', amount: 450, date: addDays(t, -2), note: 'Gasolina', affectsBalance: false }] });
    S.cards.push({ id: uid(), createdAt: Date.now(), name: 'Cuenta digital', kind: 'digital', limit: 5000, baseUsed: 800, cutBalance: 800, cutDay: 22, payDay: 5, color: 'emerald', movements: [] });
    commit('Datos de ejemplo cargados'); go('dashboard');
  };
  const hasData = S.products.length || S.sales.length || S.debts.length || S.expenses.length || S.cards.length || S.incomes.length;
  if (hasData) confirmBox({ title: 'Cargar datos de ejemplo', confirmLabel: 'Reemplazar', message: 'Tus datos actuales serán <b>reemplazados</b> por datos de ejemplo. ¿Continuar?', onConfirm: go2 });
  else go2();
}

/* =====================================================================
   RENDER Y NAVEGACIÓN
   ===================================================================== */
const VIEWS = {
  dashboard: { nav: 'Dashboard', title: 'Dashboard general', sub: 'Visión global de tus finanzas e inventario', icon: 'layout-dashboard', render: viewDashboard },
  inventario: { nav: 'Inventario y ventas', title: 'Inventario y ventas', sub: 'Control de stock dinámico y registro de ventas', icon: 'package', render: viewInventory, mount: mountInventory },
  deudas: { nav: 'Préstamos y deudas', title: 'Préstamos, deudas y créditos', sub: 'Saldos insolutos, intereses automáticos e historial de abonos', icon: 'hand-coins', render: viewDebts },
  gastos: { nav: 'Gastos', title: 'Gastos semanales y operativos', sub: 'Gastos recurrentes con historial continuo acumulado', icon: 'receipt', render: viewExpenses, mount: mountExpenses },
  reportes: { nav: 'Reporte histórico', title: 'Reporte histórico', sub: 'Todas las transacciones con filtros avanzados', icon: 'history', render: viewReports },
  config: { nav: 'Configuración', title: 'Configuración', sub: 'Preferencias y copias de seguridad', icon: 'settings', render: viewSettings, mount: mountSettings }
};
const skipDraft = new Set();
const icons = () => { if (window.lucide) try { lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); } catch (e) { console.warn(e); } };

function renderNav() {
  const dt = debtTotals(); const low = S.products.filter(p => p.stock <= S.settings.lowStock).length;
  const badges = { inventario: low ? `<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded-md bg-amber-500/15 text-amber-300">${low}</span>` : '', deudas: dt.cobrarCount + dt.deudaCount ? `<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded-md bg-white/5 text-slate-400">${dt.cobrarCount + dt.deudaCount}</span>` : '' };
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v], i) => `${k === 'config' ? '<div class="h-px bg-white/[0.06] my-3"></div>' : ''}
    <button class="nav-item ${UI.view === k ? 'active' : ''}" data-action="nav" data-view="${k}">${ic(v.icon, 'w-[18px] h-[18px]')}<span class="truncate">${v.nav}</span>${badges[k] || ''}</button>`).join('');
  const TABS = [['dashboard', 'Inicio', 'layout-dashboard'], ['inventario', 'Inventario', 'package'], ['deudas', 'Deudas', 'hand-coins'], ['gastos', 'Gastos', 'receipt'], ['reportes', 'Reporte', 'history']];
  $('#tabbar').innerHTML = `<div class="flex max-w-lg mx-auto px-1">${TABS.map(([k, l, i]) => `
    <button class="tab-item ${UI.view === k ? 'active' : ''}" data-action="nav" data-view="${k}" ${UI.view === k ? 'aria-current="page"' : ''}>
      <span class="tab-ic relative">${ic(i, 'w-[22px] h-[22px]')}${k === 'inventario' && low ? '<span class="absolute top-0.5 right-2.5 w-2 h-2 rounded-full bg-amber-400 ring-2 ring-[#0a0e15]"></span>' : ''}</span>${l}</button>`).join('')}</div>`;
  $('#hdr-config').classList.toggle('!text-indigo-300', UI.view === 'config');
  $('#hdr-config').classList.toggle('!bg-indigo-500/10', UI.view === 'config');
}

function render() {
  const v = VIEWS[UI.view] || VIEWS.dashboard; const root = $('#view');
  const ae = document.activeElement; let focus = null;
  if (ae && root.contains(ae) && ae.id) { focus = { id: ae.id }; try { focus.s = ae.selectionStart; focus.e = ae.selectionEnd; } catch { /* n/a */ } }
  const drafts = {};
  $$('form[data-draft]', root).forEach(f => {
    const k = f.dataset.draft; if (skipDraft.has(k)) return;
    drafts[k] = [...f.elements].filter(x => x.name).map(x => ({ n: x.name, t: x.type, c: x.checked, v: x.value }));
  });
  skipDraft.clear();

  root.innerHTML = v.render();
  if (v.mount) v.mount();

  Object.entries(drafts).forEach(([k, arr]) => {
    const f = root.querySelector(`form[data-draft="${k}"]`); if (!f) return;
    arr.forEach(d => [...f.elements].filter(x => x.name === d.n).forEach(x => {
      if (d.t === 'radio') { if (x.value === d.v) x.checked = d.c; } else if (d.t === 'checkbox') x.checked = d.c; else x.value = d.v;
    }));
    f.dispatchEvent(new Event('input', { bubbles: true }));
  });

  $('#page-title').textContent = v.title; $('#page-sub').textContent = v.sub;
  document.title = `${v.title} · Finanzas & Inventario`;
  $('#side-balance').textContent = money(balance());
  renderNav(); icons();
  if (focus) { const el = document.getElementById(focus.id); if (el) { el.focus(); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch { /* n/a */ } } }
}

function commit(msg) { syncInterests(); save(); render(); if (msg) toast(msg); }
function go(view) { UI.view = view; saveUI(); closeSidebar(); render(); window.scrollTo({ top: 0 }); }
function setPath(path, value) {
  const [a, b] = path.split('.');
  if (b) UI[a][b] = value; else UI[a] = value;
  if (b === 'period' && value === 'custom' && !UI[a].from) { UI[a].from = rangeFor('mensual', today()).start; UI[a].to = today(); }
  if (a === 'rep') UI.repLimit = 200;
  if (b === 'anchor' && !value) UI[a].anchor = today();
  saveUI(); render();
}
const openSidebar = () => { $('#sidebar').classList.remove('-translate-x-full'); $('#overlay').classList.remove('hidden'); };
const closeSidebar = () => { $('#sidebar').classList.add('-translate-x-full'); $('#overlay').classList.add('hidden'); };

/* =====================================================================
   EVENTOS (delegación)
   ===================================================================== */
const debtOf = el => find(S.debts, el.dataset.id);
const ACTIONS = {
  nav: el => go(el.dataset.view),
  'sidebar-open': openSidebar, 'sidebar-close': closeSidebar,
  ui: el => setPath(el.dataset.path, el.dataset.value),
  'period-shift': el => { const P = UI[el.dataset.key]; P.anchor = shiftAnchor(P.period, P.anchor, +el.dataset.dir); saveUI(); render(); },
  'period-today': el => { UI[el.dataset.key].anchor = today(); saveUI(); render(); },
  'product-new': () => openProductForm(),
  'product-edit': el => openProductForm(find(S.products, el.dataset.id)),
  'product-del': el => deleteProduct(el.dataset.id),
  'stock-inc': el => { const p = find(S.products, el.dataset.id); p && setStock(p.id, p.stock + 1); },
  'stock-dec': el => { const p = find(S.products, el.dataset.id); p && setStock(p.id, p.stock - 1); },
  'sale-new': el => openSaleForm(null, el.dataset.credit ? { payType: 'credito' } : {}),
  'sale-edit': el => openSaleForm(find(S.sales, el.dataset.id)),
  'sale-del': el => deleteSale(el.dataset.id),
  'debt-new': el => openDebtForm(null, el.dataset.kind || 'prestamo'),
  'debt-edit': el => { const d = debtOf(el); d && openDebtForm(d); },
  'debt-del': el => deleteDebt(el.dataset.id),
  'debt-pay': el => { const d = debtOf(el); d && openPaymentForm(d); },
  'debt-interest': el => { const d = debtOf(el); d && openInterestForm(d); },
  'debt-settle': el => { const d = debtOf(el); d && settleDebt(d); },
  'debt-toggle': el => { const id = el.dataset.id; UI.expanded = UI.expanded.includes(id) ? UI.expanded.filter(x => x !== id) : [...UI.expanded, id]; saveUI(); render(); },
  'exp-new': () => openMovForm('expenses'),
  'inc-new': () => openMovForm('incomes'),
  'exp-fill': el => { const f = $('#exp-form'); if (!f) return; f.elements.concept.value = el.dataset.concept; f.elements.category.value = el.dataset.category; f.elements.amount.value = el.dataset.amount; f.elements.date.value = f.elements.date.value || today(); f.elements.amount.focus(); f.elements.amount.select(); },
  'exp-goto': el => { UI.exp.period = el.dataset.period; UI.exp.anchor = el.dataset.anchor; saveUI(); render(); },
  'card-new': () => openCardForm(),
  'card-edit': el => { const c = find(S.cards, el.dataset.id); c && openCardForm(c); },
  'card-del': el => deleteCard(el.dataset.id),
  'card-mov': el => { const c = find(S.cards, el.dataset.id); c && openCardMovForm(c, null, el.dataset.type); },
  'card-history': el => { const c = find(S.cards, el.dataset.id); c && openCardHistory(c); },
  'tx-edit': el => editRef(el.dataset),
  'tx-del': el => deleteRef(el.dataset),
  'hide-install': () => { UI.hideInstall = true; saveUI(); render(); },
  'rep-more': () => { UI.repLimit += 200; render(); },
  'rep-clear': () => { Object.assign(UI.rep, { type: 'all', cat: 'all', q: '' }); saveUI(); render(); },
  'export-csv': exportCSV, 'export-json': exportJSON, 'load-sample': loadSample,
  'reset-all': () => confirmBox({ title: 'Borrar todos los datos', confirmLabel: 'Borrar definitivamente', message: 'Se eliminarán <b>todos</b> los productos, ventas, préstamos, gastos, ingresos y tarjetas de este navegador. Esta acción no se puede deshacer. Exporta una copia antes si la necesitas.', onConfirm: () => { S = defaultState(); UI.expanded = []; commit('Datos borrados'); } })
};

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-stock]')) { setStock(t.dataset.stock, t.value); return; }
  if (t.id === 'import-file') { importFile(t.files[0]); t.value = ''; return; }
  const el = t.closest('[data-ui]'); if (el && !el.dataset.live) setPath(el.dataset.ui, el.type === 'checkbox' ? el.checked : el.value);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-ui][data-live]'); if (el) setPath(el.dataset.ui, el.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else closeSidebar(); }
  if (e.key === 'Enter' && e.target.matches('[data-stock]')) e.target.blur();
});
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { S = load(); render(); } });

/* Recalcula intereses automáticamente al cambiar el día */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); commit(); } }, 60000);

/* iPhone: oculta la barra de pestañas mientras el teclado está abierto */
const isTextInput = el => !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'submit', 'file', 'range'].includes(el.type)));
document.addEventListener('focusin', e => { if (isTextInput(e.target) && window.innerWidth < 1024) document.body.classList.add('kb-open'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!isTextInput(document.activeElement)) document.body.classList.remove('kb-open'); }, 80));
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); commit(); } });

/* Modo sin conexión y almacenamiento persistente */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker:', e)));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* Inicio */
syncInterests(); save(); render();
</script>
